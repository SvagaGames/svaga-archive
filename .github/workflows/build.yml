name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      # The permanent Svaga key (same as on the server) comes from repository secrets,
      # so GitHub builds install over server builds and over each other.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SVAGA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SVAGA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SVAGA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SVAGA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secrets SVAGA_* are not set: the APK is signed with a temporary key and will not install over other builds."
            exit 0
          fi
          DIR="$RUNNER_TEMP/svaga-keys"
          mkdir -p "$DIR"
          echo "$KEYSTORE_B64" | base64 -d > "$DIR/svaga.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$DIR/svaga.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$DIR/keystore.properties"
          echo "SVAGA_KEYS=$DIR" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$DIR/svaga.jks" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | grep -E "SHA1|SHA256"
      - run: gradle assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: svaga-archive-apk
          path: app/build/outputs/apk/debug/*.apk
      # Every build of main is published as the release "latest", so the APK has a permanent download link:
      # https://github.com/SvagaGames/svaga-archive/releases/latest/download/SvagaArchive.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk SvagaArchive.apk
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          TAG="v$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" SvagaArchive.apk --title "Svaga Archive $VERSION" --notes "Сборка ${GITHUB_SHA::7}" --latest
