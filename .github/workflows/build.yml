name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      # The permanent Svaga key (same as on the server) comes from repository secrets,
      # so GitHub builds install over server builds and over each other.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SVAGA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SVAGA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SVAGA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SVAGA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secrets SVAGA_* are not set: the APK is signed with a temporary key and will not install over other builds."
            exit 0
          fi
          DIR="$RUNNER_TEMP/svaga-keys"
          mkdir -p "$DIR"
          echo "$KEYSTORE_B64" | base64 -d > "$DIR/svaga.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$DIR/svaga.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$DIR/keystore.properties"
          echo "SVAGA_KEYS=$DIR" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$DIR/svaga.jks" -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" | grep -E "SHA1|SHA256"
      # GitHub / RuStore / GetApps get APKs, Google Play gets an App Bundle. All are release builds (R8), one key.
      - run: gradle assembleGithubRelease assembleRustoreRelease assembleGetappsRelease assembleAppgalleryRelease bundlePlayRelease --no-daemon --console=plain
      - name: List RuStore SDK classes (diagnostics on failure)
        if: failure()
        run: |
          for f in $(find ~/.gradle -name 'appupdate-*.aar' 2>/dev/null | head -2); do
            mkdir -p /tmp/rs && cd /tmp/rs && unzip -o -q "$f" classes.jar && unzip -l classes.jar | grep -o 'ru/rustore/sdk/appupdate/[^ ]*\.class' | grep -v '\$' | head -80
          done
      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/github/release/*.apk out/SvagaArchive.apk
          cp app/build/outputs/apk/rustore/release/*.apk out/SvagaArchive-rustore.apk
          cp app/build/outputs/apk/getapps/release/*.apk out/SvagaArchive-getapps.apk
          cp app/build/outputs/apk/appgallery/release/*.apk out/SvagaArchive-appgallery.apk
          cp app/build/outputs/bundle/playRelease/*.aab out/SvagaArchive-play.aab
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: svaga-archive
          path: out/*
      # Every build of main is published as the release "latest", so the APK has a permanent download link:
      # https://github.com/SvagaGames/svaga-archive/releases/latest/download/SvagaArchive.apk
      # The store files are attached to the same release, ready to upload to Google Play, RuStore, GetApps and AppGallery.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          TAG="v$VERSION"
          NOTES="Сборка ${GITHUB_SHA::7}"
          [ -f CHANGELOG.md ] && NOTES="$(awk '/^## /{n++} n==1' CHANGELOG.md)"
          # the build number lets the app compare versions even if the version name ever goes down (1.7.0 -> 1.0)
          CODE=$(grep -o 'versionCode = [0-9]*' app/build.gradle.kts | grep -o '[0-9]*')
          NOTES="$(printf '%s\n\n<!-- vc:%s -->' "$NOTES" "$CODE")"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/* --title "Svaga Archive $VERSION" --notes "$NOTES" --latest
          # only the current release stays on GitHub: older ones (and their tags) are removed
          gh release list --limit 200 --json tagName -q '.[].tagName' | grep -vxF "$TAG" | while read -r old; do
            gh release delete "$old" --yes --cleanup-tag || true
          done
          git ls-remote --tags origin | awk '{print $2}' | sed 's#refs/tags/##' | grep -v '\^{}$' | grep -vxF "$TAG" | while read -r t; do
            git push origin ":refs/tags/$t" || true
          done
